name: Build X3 / X4 (apps)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: overlay
      - uses: actions/checkout@v6
        with:
          repository: crosspoint-reader-ko/crosspoint-reader-ko
          ref: 2.0.0-ko.2
          submodules: recursive
          path: src
      - name: Apply overlay
        run: |
          unzip -q overlay/.github/workflows/overlay-x3.zip -d /tmp/ov
          cp -r /tmp/ov/files/. src/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install PlatformIO
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip esptool
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-apps-x3-${{ hashFiles('src/platformio.ini') }}
          restore-keys: pio-apps-x3-
      - name: Pin core
        working-directory: src
        run: |
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          pio run -e gh_release -j1 2>&1 | tee pio.log
      - name: Size check
        working-directory: src
        run: |
          size=$(stat -c %s .pio/build/gh_release/firmware.bin)
          echo "firmware.bin: $size bytes (stock OTA slot 6553600)"
          if [ "$size" -gt 6553600 ]; then echo "::warning::larger than the stock OTA slot"; fi
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-x3
          path: src/.pio/build/gh_release/firmware.bin
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-log-x3
          path: src/pio.log
          if-no-files-found: ignore
